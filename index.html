<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiSam</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=world-2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Login -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <h1>HiSam</h1>
      <p class="subtitle">Le bureau virtuel</p>
      <input type="text" id="username-input" placeholder="Ton prenom" autocomplete="off" maxlength="20">
      <p class="avatar-caption">Choisis ton personnage</p>
      <div id="avatar-picker" class="avatar-picker"></div>
      <p id="login-error" class="login-error"></p>
      <button id="login-btn">Entrer dans le bureau</button>
    </div>
  </div>

  <!-- Main -->
  <div id="main-screen" class="screen" style="display:none">
    <header>
      <div class="header-left">
        <h1>HiSam</h1>
        <span class="my-badge" id="my-name"></span>
      </div>
      <div class="header-right">
        <div class="online-count-wrapper">
          <span class="online-count" id="online-count">0 en ligne</span>
          <div class="online-tooltip" id="online-tooltip"></div>
        </div>
        <button id="notif-btn" title="Activer les notifications">Notifications</button>
      </div>
    </header>

    <div id="world-wrap" class="world-wrap">
      <canvas id="world" class="world-canvas" tabindex="0"></canvas>

      <!-- Video (camera + partage d'ecran) : panneau flottant par-dessus le monde -->
      <div id="video-area" class="video-area" style="display:none">
        <div id="video-grid" class="video-grid"></div>
      </div>

      <div id="already-open" class="world-overlay" style="display:none">
        <div>
          <p><strong>HiSam est deja ouvert dans un autre onglet.</strong></p>
          <p>Ferme l'autre onglet puis recharge cette page.</p>
        </div>
      </div>
    </div>

    <!-- Barre de controle (toujours visible dans le bureau) -->
    <div id="active-bar" class="active-bar">
      <div class="active-bar-status" id="active-bar-status">
        <span id="group-status" class="group-status">Personne a portee de voix</span>
        <span id="mic-warning" class="mic-warning" style="display:none">Micro indisponible, ecoute seule</span>
        <span id="peer-warning" class="mic-warning" style="display:none"></span>
        <span id="net-warning" class="mic-warning" style="display:none"></span>
      </div>
      <div class="active-bar-controls">
        <select id="mic-select" class="mic-select" title="Choisir le micro" style="display:none">
          <option value="">Micro par defaut</option>
        </select>
        <div class="audio-indicator audio-level-local" id="local-level" title="Mon micro">
          <svg class="audio-indicator-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          <span class="audio-indicator-label">Toi</span>
          <div class="audio-level">
            <div class="audio-level-bar" id="local-level-bar"></div>
          </div>
        </div>
        <button id="camera-btn" class="btn-mute" title="Activer la camera">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
        </button>
        <button id="screen-btn" class="btn-mute" title="Partager mon ecran">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
        </button>
        <button id="global-mute-btn" class="btn-mute" title="Couper le micro">
          <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          <svg id="mic-off-icon" style="display:none" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        </button>
        <div class="audio-indicator audio-level-remote" id="remote-level" title="Son recu">
          <svg class="audio-indicator-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          <span class="audio-indicator-label">Eux</span>
          <div class="audio-level">
            <div class="audio-level-bar" id="remote-level-bar"></div>
          </div>
        </div>
        <button id="leave-office-btn" class="btn-leave-all">Quitter le bureau</button>
      </div>
    </div>
  </div>

  <!-- Audio elements container (hidden) -->
  <div id="audio-container" style="display:none"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="proximity.js?v=world-3"></script>
  <script src="world-map.js?v=world-3"></script>
  <script src="world.js?v=world-3"></script>
  <script src="audio-processing.js?v=audio-2"></script>
  <script src="app.js?v=audio-2"></script>
</body>
</html>
